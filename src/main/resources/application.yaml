spring:
  application:
    name: booking-engine

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      max-lifetime: 600000     # 10 minutes (prevents keeping stale connections longer than Neon's idle window)
      keepalive-time: 30000    # Ping Neon every 30s to keep connection alive while developing

  jpa:
    open-in-view: false        # Best practice: Prevents holding DB connections open through view rendering
    hibernate:
      ddl-auto: update
    show-sql: false
    logging:
      level:
        org.hibernate.orm.jdbc.bind: trace
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: default
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 10
          min-idle: 2

  kafka:
    bootstrap-servers: ${kafka-1a9f4afa-xcrc-f681.e.aivencloud.com:23468}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: booking-persistence-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.flash.bookingengine.*"