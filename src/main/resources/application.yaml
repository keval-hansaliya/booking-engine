spring:
  application:
    name: booking-engine

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      max-lifetime: 600000     # 10 minutes (prevents keeping stale connections longer than Neon's idle window)
      keepalive-time: 30000    # Ping Neon every 30s to keep connection alive while developing

  jpa:
    open-in-view: false        # Best practice: Prevents holding DB connections open through view rendering
    hibernate:
      ddl-auto: update
    show-sql: false
    logging:
      level:
        org.hibernate.orm.jdbc.bind: trace
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: default
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 10
          min-idle: 2

  spring:
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
      properties:
        security.protocol: SASL_SSL
        sasl.mechanism: SCRAM-SHA-256
        sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";
      producer:
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
        acks: all
        retries: 3
      consumer:
        group-id: booking-persistence-group
        auto-offset-reset: earliest
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
        properties:
          spring.json.trusted.packages: "com.flash.bookingengine.*"

logging:
  level:
    root: WARN
    com.flash.bookingengine: INFO
    org.springframework.boot.web.embedded.tomcat: INFO
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
    org.hibernate: WARN
    org.springframework.data: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%15.15t] %-30.30logger{30} : %msg%n"